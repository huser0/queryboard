[workspace]
members = ["fuzz"]

[package]
name = "queryboard"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "queryboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["tauri-app"]
# Isola o binário Tauri (janela, generate_context!) do resto do crate.
# Sem isso, o fuzz target de sql::guard (que não tem nada a ver com GUI)
# arrasta toda a árvore de dependências do Tauri, incluindo o macro
# generate_context! — que quebra sob cargo-fuzz por divergência de
# resolução de features entre grafo host/target quando --target é
# passado explicitamente (mesmo sendo o mesmo triple do host). Ver
# docs/adr/0002-parser-sql.md.
tauri-app = []
# Testes que precisam de um Postgres real (via testcontainers). Rodam
# separado do `cargo test` normal — ver CLAUDE.md §9 ("nenhum teste toca
# banco de produção"; testcontainers efêmero é a exceção permitida).
integration = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.62.0", features = ["visitor"] }
thiserror = "2.0.19"
async-trait = "0.1.91"
tokio-util = "0.7.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
regex = "1.13.1"
futures-util = "0.3.33"
chrono = "0.4.45"
keyring = "4.1.5"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
ts-rs = "12.0.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "uuid", "json", "migrate", "macros"] }
dirs = "6.0.0"
# Driver Oracle — Rota B (ver CLAUDE.md §3): crate ODPI-C/OCI, maduro
# (2.3M+ downloads), carrega `libclntsh` do Oracle Instant Client via
# dlopen em runtime, não em link-time — buildar este crate não exige
# Instant Client instalado na máquina, só rodar contra um Oracle real
# exige. Decisão registrada em CLAUDE.md §3 depois de spike real.
oracle = { version = "0.6", features = ["chrono"] }

[dev-dependencies]
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql"] }

